<!doctype html>
<html lang="en" class="dark h-full">
  <head>
    <link rel="icon" type="image/png" href="/app-logo.png" />
    <title>CekcokDraw - High Performance Raster Graphics Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const theme = localStorage.getItem('cekcok_theme');
        if (
          theme === 'light' ||
          (theme === 'system' && !window.matchMedia('(prefers-color-scheme: dark)').matches)
        ) {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full bg-ps-bg text-ps-text font-sans antialiased overflow-hidden select-none">
    <div id="root" class="h-full w-full"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
